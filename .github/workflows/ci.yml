name: NEXUS TITAN CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-ai-tests:
    name: Python AI Runtime & API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run pytest
        run: pytest tests/ai -v

  cpp-systems-build:
    name: C++20 Systems Layer Build & CTest
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure CMake (CPU-Only Fallback)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DTITAN_ENABLE_CUDA=OFF
      - name: Compile Systems Targets
        run: cmake --build build --config Release
      - name: Run CTest
        run: ctest --test-dir build -C Release --output-on-failure

  typescript-presentation-tests:
    name: TypeScript Presentation & Bridge Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run Vitest Suite
        run: npm test
      - name: Build Distribution
        run: npm run build
